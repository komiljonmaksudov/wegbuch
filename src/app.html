<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before the first paint. All iPhone browsers use WebKit too, so they match here.
			// app.css uses data-engine="webkit" for the few shapes Safari draws wrong.
			if (/^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent)) {
				document.documentElement.dataset.engine = "webkit";
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
